app = "lost-bot"
primary_region = "iad"

[build]
  # only needed if you use a Dockerfile or buildpack

[[services]]
  internal_port = 3000
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    path = "/"
